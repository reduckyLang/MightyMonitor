[package]
name = "host-linux"
description = "MightyMonitor Linux X11 and optional Wayland screen capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mightymonitor-core = { path = "../core" }
thiserror.workspace = true
x11rb = "0.13.2"

[features]
default = []
pipewire = ["dep:ashpd", "dep:pipewire", "dep:tokio", "dep:futures-util"]

[target.'cfg(target_os = "linux")'.dependencies.ashpd]
version = "=0.10.2"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.pipewire]
version = "=0.8.0"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.tokio]
workspace = true
optional = true

[target.'cfg(target_os = "linux")'.dependencies.futures-util]
version = "0.3"
optional = true
