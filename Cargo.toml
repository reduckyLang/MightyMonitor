[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/reduckyLang/MightyMonitor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Keep bincode 1.3 for its serde-based API and wire format compatibility.
bincode = "1.3"
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
