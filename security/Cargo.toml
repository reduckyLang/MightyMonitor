[package]
name = "trinix-security"
description = "Pinned TLS and explicit local viewing invitations for Trinix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
async = ["dep:tokio", "dep:tokio-rustls"]

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["ring", "zeroize"] }
# Keep the workspace's Rust 1.85 baseline; only generation uses this dependency.
time = "=0.3.44"
base64 = "=0.22.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = "=1.8.2"
trinix-core = { path = "../core" }
getrandom = { version = "=0.2.17", features = ["std"] }
tokio = { workspace = true, optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
