name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version label
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: Installer version label
        required: true
        type: string
  push:
    branches: ['codex/wayland-sharing', 'codex/windows-installer', 'codex/remote-control', main]
    paths: ['packaging/windows/**', 'scripts/windows/**', 'viewer/**', 'host/**', 'core/**', 'security/**', 'codec-gst/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows-installer.yml']
permissions:
  contents: read
jobs:
  installer:
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install verified build SDK
        shell: pwsh
        run: ./scripts/windows/install-gstreamer.ps1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p trinix-host -p trinix-viewer
      - name: Build per-user setup executable
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'The runner must provide Inno Setup 6; refusing an unverified compiler download.' }
          $isccArgs = @()
          if ($env:INSTALLER_VERSION) { $isccArgs += "/DAppVersion=$env:INSTALLER_VERSION" }
          & $compiler @isccArgs packaging/windows/trinix.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install, verify the private runtime, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem output/installers/*-windows-x64-setup.exe).FullName
          $app = Join-Path $env:RUNNER_TEMP 'Trinix app smoke'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$app`"", "/LOG=`"$env:RUNNER_TEMP\mm-setup.log`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed: $($process.ExitCode)" }
          foreach ($file in @('trinix-host.exe', 'trinix-viewer.exe', 'trinix-launcher.exe', 'unins000.exe')) {
            if (-not (Test-Path (Join-Path $app $file))) { throw "Missing installed file: $file" }
          }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'gstreamer' }) -join ';'
          Remove-Item Env:GST_PLUGIN_PATH, Env:GST_PLUGIN_PATH_1_0, Env:GST_PLUGIN_SYSTEM_PATH_1_0, Env:GSTREAMER_1_0_ROOT_MSVC_X86_64 -ErrorAction SilentlyContinue
          $check = Start-Process (Join-Path $app 'trinix-launcher.exe') -ArgumentList '--check-runtime' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Installed video decoder check failed: $($check.ExitCode)" }
          $uninstall = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path (Join-Path $app 'trinix-viewer.exe'))) { throw 'App uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: trinix-windows-installer
          path: output/installers/*-windows-x64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-installer-diagnostics
          path: ${{ runner.temp }}/mm-setup.log
