[package]
name = "trinix-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "trinix-host"
path = "src/main.rs"

[features]
default = ["pipewire"]
pipewire = ["host-linux/pipewire"]

[dependencies]
trinix-core = { path = "../core" }
trinix-security = { path = "../security", features = ["async"] }
tokio.workspace = true
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
host-linux = { path = "../host-linux" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
codec-gst = { path = "../codec-gst" }
enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
socket2 = "0.6"
trinix-viewer = { path = "../viewer", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }
