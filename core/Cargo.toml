[package]
name = "mightymonitor-core"
description = "MightyMonitor protocol, framing and platform traits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "net", "io-util", "time"] }
