[package]
name = "trinix-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "trinix-viewer"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:qrcode"]

[dependencies]
trinix-discovery = { path = "../discovery" }
qrcode = { version = "=0.14.1", default-features = false, optional = true }
trinix-core = { path = "../core" }
trinix-security = { path = "../security", features = ["async"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
async-trait = "0.1"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
codec-gst = { path = "../codec-gst" }

[dev-dependencies]
regex = "=1.13.1"
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "ui_snapshot"
required-features = ["gui"]

[[bin]]
name = "trinix-launcher"
path = "src/launcher.rs"
